<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WhatsApp CRM - Barantum Style</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM UMD CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  
  <!-- Babel Standalone untuk kompilasi JSX di browser -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.6/babel.min.js"></script>

  <style>
    /* Scrollbar minimalis ala CRM modern */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased overflow-hidden m-0 p-0">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    const DEFAULT_SUPABASE_URL = 'https://axveczjyamcljxqfnssv.supabase.co';
    const DEFAULT_SUPABASE_ANON_KEY =
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF4dmVjemp5YW1jbGp4cWZuc3N2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAxMzA2NjYsImV4cCI6MjEwNTcwNjY2Nn0.CDW9IxJPQeIWNEoqUv5cM3Uqlr0k9GYVaBOzLtt9G0Q';
    
    // Gunakan relative path jika sudah satu domain di Vercel, atau fallback ke domain absolut
    const DEFAULT_API_URL = window.location.origin.includes('vercel.app')
      ? '/api/send-message'
      : 'https://crm-wa-backend.vercel.app/api/send-message';

    // Komponen Ikon SVG Standar
    const SendIcon = () => (
      <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
      </svg>
    );

    const CheckIcon = () => (
      <svg className="w-3.5 h-3.5 text-gray-400 inline" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5 13l4 4L19 7" />
      </svg>
    );

    const CheckCheckIcon = ({ color = 'text-blue-500' }) => (
      <svg className={`w-3.5 h-3.5 ${color} inline`} fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5 13l4 4L19 7M9 13l4 4L23 7" />
      </svg>
    );

    const SearchIcon = () => (
      <svg className="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
      </svg>
    );

    const RefreshCwIcon = ({ spinning }) => (
      <svg className={`w-4 h-4 ${spinning ? 'animate-spin' : ''}`} fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
      </svg>
    );

    const TagIcon = () => (
      <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z" />
      </svg>
    );

    const FileTextIcon = () => (
      <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
      </svg>
    );

    const CreditCardIcon = () => (
      <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z" />
      </svg>
    );

    const SettingsIcon = () => (
      <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
      </svg>
    );

    const UserIcon = () => (
      <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
      </svg>
    );

    const XIcon = () => (
      <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" />
      </svg>
    );

    const InboxIcon = () => (
      <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4" />
      </svg>
    );

    const QUICK_TEMPLATES = [
      {
        id: 1,
        title: 'Sapaan Pelanggan',
        text: 'Halo! Terima kasih telah menghubungi kami. Ada yang bisa kami bantu hari ini?'
      },
      {
        id: 2,
        title: 'Konfirmasi Pembayaran',
        text: 'Pembayaran Anda telah kami terima dengan baik. Pesanan akan segera diproses. Terima kasih!'
      },
      {
        id: 3,
        title: 'Follow Up Prospek',
        text: 'Halo kak, apakah ada pertanyaan lebih lanjut terkait penawaran layanan yang kami kirimkan kemarin?'
      },
      {
        id: 4,
        title: 'Info Jam Operasional',
        text: 'Halo! Jam operasional CS kami adalah Senin - Sabtu pukul 08.00 - 17.00 WIB. Kami akan membalas segera saat online.'
      }
    ];

    function App() {
      const [supabaseUrl, setSupabaseUrl] = useState(DEFAULT_SUPABASE_URL);
      const [supabaseAnonKey, setSupabaseAnonKey] = useState(DEFAULT_SUPABASE_ANON_KEY);
      const [apiUrl, setApiUrl] = useState(DEFAULT_API_URL);

      const [contacts, setContacts] = useState([]);
      const [selectedContact, setSelectedContact] = useState(null);
      const [messages, setMessages] = useState([]);
      const [inputText, setInputText] = useState('');
      const [searchQuery, setSearchQuery] = useState('');
      const [activeFilterTab, setActiveFilterTab] = useState('all');

      const [contactTags, setContactTags] = useState({});
      const [newTagInput, setNewTagInput] = useState('');

      const [isRefreshing, setIsRefreshing] = useState(false);
      const [isSending, setIsSending] = useState(false);
      const [notification, setNotification] = useState(null);

      const [showTemplateModal, setShowTemplateModal] = useState(false);
      const [showInvoiceModal, setShowInvoiceModal] = useState(false);
      const [showSettingsModal, setShowSettingsModal] = useState(false);
      const [showCrmPanel, setShowCrmPanel] = useState(true);

      const [invoiceData, setInvoiceData] = useState({
        item: 'Paket Berlangganan CRM',
        amount: '150000',
        account: 'BCA 123-456-7890 a/n Sahabat Guru'
      });

      const chatEndRef = useRef(null);

      const showNotice = (msg, type = 'info') => {
        setNotification({ msg, type });
        setTimeout(() => {
          setNotification(null);
        }, 4500);
      };

      const fetchContacts = useCallback(async () => {
        try {
          const res = await fetch(`${supabaseUrl}/rest/v1/contacts?select=*&order=created_at.desc`, {
            headers: {
              apikey: supabaseAnonKey,
              Authorization: `Bearer ${supabaseAnonKey}`
            }
          });

          if (!res.ok) throw new Error(`HTTP ${res.status}: Gagal memuat kontak`);
          const data = await res.json();
          setContacts(data || []);

          if (data && data.length > 0 && !selectedContact) {
            setSelectedContact(data[0]);
          }
        } catch (err) {
          console.warn('Gagal memuat kontak:', err.message);
        }
      }, [supabaseUrl, supabaseAnonKey, selectedContact]);

      const fetchMessages = useCallback(async (contactId) => {
        if (!contactId) return;
        try {
          const res = await fetch(
            `${supabaseUrl}/rest/v1/messages?contact_id=eq.${contactId}&order=created_at.asc`,
            {
              headers: {
                apikey: supabaseAnonKey,
                Authorization: `Bearer ${supabaseAnonKey}`
              }
            }
          );

          if (!res.ok) return;
          const data = await res.json();
          setMessages(data || []);
        } catch (err) {
          console.warn('Gagal memuat pesan:', err.message);
        }
      }, [supabaseUrl, supabaseAnonKey]);

      useEffect(() => {
        fetchContacts();
      }, [fetchContacts]);

      useEffect(() => {
        if (selectedContact?.id) {
          fetchMessages(selectedContact.id);
        }
      }, [selectedContact, fetchMessages]);

      // Polling pesan setiap 4 detik untuk update otomatis pesan masuk
      useEffect(() => {
        const timer = setInterval(() => {
          if (selectedContact?.id) {
            fetchMessages(selectedContact.id);
          }
        }, 4000);
        return () => clearInterval(timer);
      }, [selectedContact, fetchMessages]);

      useEffect(() => {
        chatEndRef.current?.scrollIntoView({ behavior: 'smooth' });
      }, [messages]);

      const handleSendMessage = async (textToSend) => {
        const content = (textToSend || inputText).trim();
        if (!content || !selectedContact) return;

        setIsSending(true);

        const tempId = `temp-${Date.now()}`;
        const optimisticMsg = {
          id: tempId,
          content,
          direction: 'outbound',
          status: 'sending',
          created_at: new Date().toISOString()
        };
        setMessages((prev) => [...prev, optimisticMsg]);
        setInputText('');

        try {
          const response = await fetch(apiUrl, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              phone_number: selectedContact.phone_number,
              contact_id: selectedContact.id,
              message_text: content
            })
          });

          const result = await response.json();

          if (!response.ok) {
            throw new Error(result.error || 'Gagal mengirim pesan melalui backend API');
          }

          showNotice('Pesan WhatsApp berhasil terkirim!', 'success');
          fetchMessages(selectedContact.id);
        } catch (err) {
          console.error('Send error:', err);
          showNotice(`Gagal mengirim: ${err.message}`, 'error');
          setMessages((prev) =>
            prev.map((m) => (m.id === tempId ? { ...m, status: 'failed' } : m))
          );
        } finally {
          setIsSending(false);
        }
      };

      const handleAddTag = (tag) => {
        if (!selectedContact || !tag.trim()) return;
        const cid = selectedContact.id;
        const currentTags = contactTags[cid] || ['Pelanggan'];
        if (!currentTags.includes(tag.trim())) {
          setContactTags({ ...contactTags, [cid]: [...currentTags, tag.trim()] });
        }
        setNewTagInput('');
      };

      const handleRemoveTag = (tagToRemove) => {
        if (!selectedContact) return;
        const cid = selectedContact.id;
        const currentTags = contactTags[cid] || [];
        setContactTags({
          ...contactTags,
          [cid]: currentTags.filter((t) => t !== tagToRemove)
        });
      };

      const handleSendInvoice = () => {
        const formattedAmount = Number(invoiceData.amount).toLocaleString('id-ID');
        const invoiceMsg = `*INVOICE PEMBAYARAN*\n----------------------------------\nLayanan: *${invoiceData.item}*\nTotal: *Rp ${formattedAmount}*\n\nSilakan transfer ke:\n*${invoiceData.account}*\n----------------------------------\nKirimkan bukti transfer di sini setelah melakukan pembayaran. Terima kasih!`;
        setShowInvoiceModal(false);
        handleSendMessage(invoiceMsg);
      };

      const filteredContacts = contacts.filter((c) => {
        const query = searchQuery.toLowerCase();
        const matchName = (c.name || '').toLowerCase().includes(query);
        const matchPhone = (c.phone_number || '').includes(query);
        return matchName || matchPhone;
      });

      return (
        <div className="flex h-screen w-full bg-slate-100 text-slate-800 font-sans antialiased overflow-hidden">
          {/* Toast Notification Banner */}
          {notification && (
            <div
              className={`fixed top-4 right-4 z-50 px-4 py-3 rounded-xl shadow-2xl text-sm font-medium flex items-center gap-2 transition-all ${
                notification.type === 'error'
                  ? 'bg-rose-600 text-white'
                  : notification.type === 'success'
                  ? 'bg-emerald-600 text-white'
                  : 'bg-slate-800 text-white'
              }`}
            >
              <span>{notification.msg}</span>
              <button onClick={() => setNotification(null)} className="ml-2 hover:opacity-80">
                <XIcon />
              </button>
            </div>
          )}

          {/* Mini CRM Left Sidebar */}
          <div className="w-16 bg-slate-900 flex flex-col items-center py-4 justify-between border-r border-slate-800 shrink-0">
            <div className="flex flex-col items-center gap-6">
              <div className="w-10 h-10 rounded-xl bg-emerald-500 text-white flex items-center justify-center font-bold text-lg shadow-lg">
                WA
              </div>
              <button
                title="Kotak Masuk"
                className="p-3 text-emerald-400 bg-slate-800 rounded-xl hover:bg-slate-700 transition"
              >
                <InboxIcon />
              </button>
              <button
                title="Template Balasan"
                onClick={() => setShowTemplateModal(true)}
                className="p-3 text-slate-400 hover:text-white hover:bg-slate-800 rounded-xl transition"
              >
                <FileTextIcon />
              </button>
              <button
                title="Kirim Tagihan"
                onClick={() => setShowInvoiceModal(true)}
                className="p-3 text-slate-400 hover:text-white hover:bg-slate-800 rounded-xl transition"
              >
                <CreditCardIcon />
              </button>
            </div>

            <div className="flex flex-col items-center gap-4">
              <button
                title="Pengaturan Integrasi"
                onClick={() => setShowSettingsModal(true)}
                className="p-3 text-slate-400 hover:text-white hover:bg-slate-800 rounded-xl transition"
              >
                <SettingsIcon />
              </button>
            </div>
          </div>

          {/* Contact List Column */}
          <div className="w-80 md:w-96 bg-white border-r border-slate-200 flex flex-col shrink-0">
            {/* Header */}
            <div className="p-4 border-b border-slate-100 flex items-center justify-between">
              <div>
                <h1 className="font-bold text-lg text-slate-900">WhatsApp CRM</h1>
                <p className="text-xs text-slate-500">Barantum-Style Dashboard</p>
              </div>
              <button
                onClick={async () => {
                  setIsRefreshing(true);
                  await fetchContacts();
                  if (selectedContact) await fetchMessages(selectedContact.id);
                  setIsRefreshing(false);
                }}
                title="Segarkan data kontak & pesan"
                className="p-2 text-slate-500 hover:text-emerald-600 rounded-lg hover:bg-slate-100 transition"
              >
                <RefreshCwIcon spinning={isRefreshing} />
              </button>
            </div>

            {/* Search Bar */}
            <div className="p-3 border-b border-slate-100">
              <div className="relative">
                <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                  <SearchIcon />
                </div>
                <input
                  type="text"
                  placeholder="Cari kontak atau nomor HP..."
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                  className="w-full pl-9 pr-4 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500"
                />
              </div>
            </div>

            {/* Filter Badges */}
            <div className="px-3 py-2 border-b border-slate-100 flex gap-1.5 overflow-x-auto text-xs">
              {['all', 'Hot Lead', 'Pelanggan'].map((tab) => (
                <button
                  key={tab}
                  onClick={() => setActiveFilterTab(tab)}
                  className={`px-3 py-1 rounded-full font-medium whitespace-nowrap transition ${
                    activeFilterTab === tab
                      ? 'bg-emerald-600 text-white'
                      : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                  }`}
                >
                  {tab === 'all' ? 'Semua Obrolan' : tab}
                </button>
              ))}
            </div>

            <div className="flex-1 overflow-y-auto divide-y divide-slate-50">
              {filteredContacts.length === 0 ? (
                <div className="p-8 text-center text-slate-400 text-sm">
                  Tidak ada kontak ditemukan di database.
                </div>
              ) : (
                filteredContacts.map((contact) => {
                  const isSelected = selectedContact?.id === contact.id;
                  const tags = contactTags[contact.id] || ['Hot Lead'];

                  return (
                    <div
                      key={contact.id}
                      onClick={() => setSelectedContact(contact)}
                      className={`p-3.5 flex items-start gap-3 cursor-pointer transition ${
                        isSelected ? 'bg-emerald-50/80 border-l-4 border-emerald-500' : 'hover:bg-slate-50'
                      }`}
                    >
                      <div className="w-11 h-11 rounded-full bg-slate-200 flex items-center justify-center font-bold text-slate-700 shrink-0">
                        {(contact.name || contact.phone_number || 'U')[0].toUpperCase()}
                      </div>
                      <div className="flex-1 min-w-0">
                        <div className="flex items-center justify-between">
                          <h2 className="font-semibold text-sm text-slate-800 truncate">
                            {contact.name || contact.phone_number}
                          </h2>
                          <span className="text-[10px] text-slate-400">
                            {contact.created_at
                              ? new Date(contact.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                              : ''}
                          </span>
                        </div>
                        <p className="text-xs text-slate-500 truncate mt-0.5">
                          +{contact.phone_number}
                        </p>
                        <div className="flex gap-1 mt-1.5 flex-wrap">
                          {tags.map((t, idx) => (
                            <span
                              key={idx}
                              className="px-2 py-0.5 bg-slate-100 text-slate-600 text-[10px] font-medium rounded"
                            >
                              {t}
                            </span>
                          ))}
                        </div>
                      </div>
                    </div>
                  );
                })
              )}
            </div>
          </div>

          <div className="flex-1 flex flex-col bg-slate-50 min-w-0">
            {selectedContact ? (
              <>
                {/* Header Percakapan */}
                <div className="h-16 px-6 bg-white border-b border-slate-200 flex items-center justify-between shrink-0">
                  <div className="flex items-center gap-3">
                    <div className="w-10 h-10 rounded-full bg-emerald-100 text-emerald-700 flex items-center justify-center font-bold">
                      {(selectedContact.name || 'U')[0].toUpperCase()}
                    </div>
                    <div>
                      <h2 className="font-bold text-slate-800 text-sm">
                        {selectedContact.name || selectedContact.phone_number}
                      </h2>
                      <p className="text-xs text-emerald-600 flex items-center gap-1.5">
                        <span className="w-2 h-2 rounded-full bg-emerald-500"></span>
                        +{selectedContact.phone_number} • WhatsApp Connected
                      </p>
                    </div>
                  </div>

                  <div className="flex items-center gap-2">
                    <button
                      onClick={() => setShowTemplateModal(true)}
                      className="px-3 py-1.5 text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg flex items-center gap-1.5 transition font-medium"
                    >
                      <FileTextIcon /> Template
                    </button>
                    <button
                      onClick={() => setShowInvoiceModal(true)}
                      className="px-3 py-1.5 text-xs bg-emerald-50 hover:bg-emerald-100 text-emerald-700 border border-emerald-200 rounded-lg flex items-center gap-1.5 transition font-medium"
                    >
                      <CreditCardIcon /> Buat Tagihan
                    </button>
                    <button
                      onClick={() => setShowCrmPanel(!showCrmPanel)}
                      className={`p-2 rounded-lg text-slate-600 hover:bg-slate-100 transition ${
                        showCrmPanel ? 'bg-slate-100' : ''
                      }`}
                      title="Panel CRM Kontak"
                    >
                      <UserIcon />
                    </button>
                  </div>
                </div>

                {/* Daftar Gelembung Pesan */}
                <div className="flex-1 p-6 overflow-y-auto space-y-4">
                  <div className="text-center my-2">
                    <span className="px-3 py-1 bg-white border border-slate-200 rounded-full text-[11px] text-slate-500 shadow-sm">
                      Percakapan Terenkripsi WhatsApp Cloud API
                    </span>
                  </div>

                  {messages.map((msg) => {
                    const isOutbound = msg.direction === 'outbound';
                    return (
                      <div
                        key={msg.id}
                        className={`flex ${isOutbound ? 'justify-end' : 'justify-start'}`}
                      >
                        <div
                          className={`max-w-[70%] rounded-2xl px-4 py-2.5 shadow-sm text-sm relative leading-relaxed ${
                            isOutbound
                              ? 'bg-emerald-600 text-white rounded-br-none'
                              : 'bg-white text-slate-800 border border-slate-200 rounded-bl-none'
                          }`}
                        >
                          <p className="whitespace-pre-line break-words">{msg.content}</p>
                          <div
                            className={`flex items-center justify-end gap-1.5 mt-1 text-[10px] ${
                              isOutbound ? 'text-emerald-100' : 'text-slate-400'
                            }`}
                          >
                            <span>
                              {msg.created_at
                                ? new Date(msg.created_at).toLocaleTimeString([], {
                                    hour: '2-digit',
                                    minute: '2-digit'
                                  })
                                : ''}
                            </span>
                            {isOutbound && (
                              <span>
                                {msg.status === 'read' ? (
                                  <CheckCheckIcon color="text-cyan-200" />
                                ) : msg.status === 'delivered' ? (
                                  <CheckCheckIcon color="text-emerald-200" />
                                ) : (
                                  <CheckIcon />
                                )}
                              </span>
                            )}
                          </div>
                        </div>
                      </div>
                    );
                  })}
                  <div ref={chatEndRef} />
                </div>

                <!-- Input Pengiriman Pesan -->
                <div className="p-4 bg-white border-t border-slate-200">
                  <form
                    onSubmit={(e) => {
                      e.preventDefault();
                      handleSendMessage();
                    }}
                    className="flex items-center gap-3"
                  >
                    <input
                      type="text"
                      placeholder="Ketik balasan pesan WhatsApp ke pelanggan..."
                      value={inputText}
                      onChange={(e) => setInputText(e.target.value)}
                      disabled={isSending}
                      className="flex-1 px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 disabled:opacity-60"
                    />
                    <button
                      type="submit"
                      disabled={isSending || !inputText.trim()}
                      className="px-5 py-3 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl flex items-center gap-2 font-medium text-sm transition shadow-md disabled:opacity-50 disabled:cursor-not-allowed"
                    >
                      <SendIcon />
                      <span>{isSending ? 'Mengirim...' : 'Kirim'}</span>
                    </button>
                  </form>
                </div>
              </>
            ) : (
              <div className="flex-1 flex flex-col items-center justify-center text-slate-400">
                <InboxIcon />
                <p className="mt-2 text-sm font-medium">Pilih obrolan dari daftar sebelah kiri</p>
              </div>
            )}
          </div>

          {showCrmPanel && selectedContact && (
            <div className="w-72 bg-white border-l border-slate-200 p-5 flex flex-col justify-between shrink-0 overflow-y-auto">
              <div>
                <div className="text-center pb-4 border-b border-slate-100">
                  <div className="w-16 h-16 rounded-full bg-slate-100 border border-slate-200 text-slate-700 flex items-center justify-center font-bold text-xl mx-auto mb-2">
                    {(selectedContact.name || 'U')[0].toUpperCase()}
                  </div>
                  <h3 className="font-bold text-slate-800 text-sm">
                    {selectedContact.name || selectedContact.phone_number}
                  </h3>
                  <p className="text-xs text-slate-400 mt-0.5">+{selectedContact.phone_number}</p>
                </div>

                {/* Manajemen Tag & Label */}
                <div className="mt-5">
                  <div className="flex items-center justify-between mb-2">
                    <span className="text-xs font-semibold text-slate-700 flex items-center gap-1.5">
                      <TagIcon /> Label & Segmentasi
                    </span>
                  </div>
                  <div className="flex flex-wrap gap-1.5 mb-3">
                    {(contactTags[selectedContact.id] || ['Hot Lead', 'Pelanggan']).map(
                      (tag, idx) => (
                        <span
                          key={idx}
                          className="px-2.5 py-1 bg-emerald-50 text-emerald-700 text-xs font-medium rounded-full flex items-center gap-1 border border-emerald-200"
                        >
                          {tag}
                          <button
                            onClick={() => handleRemoveTag(tag)}
                            className="hover:text-rose-600"
                          >
                            <XIcon />
                          </button>
                        </span>
                      )
                    )}
                  </div>
                  <div className="flex gap-2">
                    <input
                      type="text"
                      placeholder="Tambah label..."
                      value={newTagInput}
                      onChange={(e) => setNewTagInput(e.target.value)}
                      onKeyDown={(e) => {
                        if (e.key === 'Enter') {
                          e.preventDefault();
                          handleAddTag(newTagInput);
                        }
                      }}
                      className="flex-1 px-3 py-1.5 bg-slate-50 border border-slate-200 rounded-lg text-xs focus:outline-none focus:ring-1 focus:ring-emerald-500"
                    />
                    <button
                      type="button"
                      onClick={() => handleAddTag(newTagInput)}
                      className="px-3 py-1.5 bg-slate-800 text-white rounded-lg text-xs hover:bg-slate-700 transition"
                    >
                      +
                    </button>
                  </div>
                </div>

                {/* Ringkasan Kontak */}
                <div className="mt-6 pt-5 border-t border-slate-100 space-y-3 text-xs">
                  <div className="flex justify-between py-1 border-b border-slate-50">
                    <span className="text-slate-400">Total Pesan:</span>
                    <span className="font-semibold text-slate-700">{messages.length}</span>
                  </div>
                  <div className="flex justify-between py-1 border-b border-slate-50">
                    <span className="text-slate-400">Status Saluran:</span>
                    <span className="font-semibold text-emerald-600">Meta Verified</span>
                  </div>
                  <div className="flex justify-between py-1 border-b border-slate-50">
                    <span className="text-slate-400">Tercatat Sejak:</span>
                    <span className="font-semibold text-slate-700">
                      {selectedContact.created_at
                        ? new Date(selectedContact.created_at).toLocaleDateString('id-ID')
                        : 'Hari ini'}
                    </span>
                  </div>
                </div>
              </div>

              <div className="pt-4 border-t border-slate-100">
                <button
                  onClick={() => setShowInvoiceModal(true)}
                  className="w-full py-2.5 bg-emerald-50 text-emerald-700 hover:bg-emerald-100 font-semibold rounded-xl text-xs border border-emerald-200 flex items-center justify-center gap-2 transition"
                >
                  <CreditCardIcon /> Kirim Tagihan WhatsApp
                </button>
              </div>
            </div>
          )}

          {/* Modal Template */}
          {showTemplateModal && (
            <div className="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl w-full max-w-md shadow-2xl p-6">
                <div className="flex items-center justify-between pb-3 border-b border-slate-100">
                  <h3 className="font-bold text-slate-800 text-base">Template Balasan Cepat</h3>
                  <button
                    onClick={() => setShowTemplateModal(false)}
                    className="text-slate-400 hover:text-slate-600"
                  >
                    <XIcon />
                  </button>
                </div>
                <div className="space-y-3 my-4 max-h-80 overflow-y-auto">
                  {QUICK_TEMPLATES.map((tmpl) => (
                    <div
                      key={tmpl.id}
                      onClick={() => {
                        setInputText(tmpl.text);
                        setShowTemplateModal(false);
                      }}
                      className="p-3.5 border border-slate-200 hover:border-emerald-500 hover:bg-emerald-50/50 rounded-xl cursor-pointer transition text-left"
                    >
                      <p className="font-semibold text-xs text-slate-800">{tmpl.title}</p>
                      <p className="text-xs text-slate-500 mt-1 line-clamp-2">{tmpl.text}</p>
                    </div>
                  ))}
                </div>
                <button
                  onClick={() => setShowTemplateModal(false)}
                  className="w-full py-2 text-xs font-semibold text-slate-600 hover:bg-slate-100 rounded-xl transition"
                >
                  Tutup
                </button>
              </div>
            </div>
          )}

          {/* Modal Invoice Tagihan */}
          {showInvoiceModal && (
            <div className="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl w-full max-w-md shadow-2xl p-6">
                <div className="flex items-center justify-between pb-3 border-b border-slate-100">
                  <h3 className="font-bold text-slate-800 text-base">Kirim Tagihan (Invoice)</h3>
                  <button
                    onClick={() => setShowInvoiceModal(false)}
                    className="text-slate-400 hover:text-slate-600"
                  >
                    <XIcon />
                  </button>
                </div>
                <div className="space-y-3.5 my-4">
                  <div>
                    <label className="text-xs font-semibold text-slate-700 block mb-1">
                      Nama Item / Layanan:
                    </label>
                    <input
                      type="text"
                      value={invoiceData.item}
                      onChange={(e) => setInvoiceData({ ...invoiceData, item: e.target.value })}
                      className="w-full px-3 py-2 border border-slate-200 rounded-lg text-xs focus:ring-2 focus:ring-emerald-500 focus:outline-none"
                    />
                  </div>
                  <div>
                    <label className="text-xs font-semibold text-slate-700 block mb-1">
                      Nominal (Rp):
                    </label>
                    <input
                      type="number"
                      value={invoiceData.amount}
                      onChange={(e) => setInvoiceData({ ...invoiceData, amount: e.target.value })}
                      className="w-full px-3 py-2 border border-slate-200 rounded-lg text-xs focus:ring-2 focus:ring-emerald-500 focus:outline-none"
                    />
                  </div>
                  <div>
                    <label className="text-xs font-semibold text-slate-700 block mb-1">
                      Instruksi Pembayaran / Rekening:
                    </label>
                    <input
                      type="text"
                      value={invoiceData.account}
                      onChange={(e) => setInvoiceData({ ...invoiceData, account: e.target.value })}
                      className="w-full px-3 py-2 border border-slate-200 rounded-lg text-xs focus:ring-2 focus:ring-emerald-500 focus:outline-none"
                    />
                  </div>
                </div>
                <div className="flex gap-2">
                  <button
                    onClick={() => setShowInvoiceModal(false)}
                    className="w-1/2 py-2 text-xs font-semibold text-slate-600 hover:bg-slate-100 rounded-xl transition"
                  >
                    Batal
                  </button>
                  <button
                    onClick={handleSendInvoice}
                    className="w-1/2 py-2 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold rounded-xl transition shadow"
                  >
                    Kirim via WhatsApp
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Modal Pengaturan Kredensial */}
          {showSettingsModal && (
            <div className="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl w-full max-w-lg shadow-2xl p-6">
                <div className="flex items-center justify-between pb-3 border-b border-slate-100">
                  <h3 className="font-bold text-slate-800 text-base">Pengaturan Integrasi CRM</h3>
                  <button
                    onClick={() => setShowSettingsModal(false)}
                    className="text-slate-400 hover:text-slate-600"
                  >
                    <XIcon />
                  </button>
                </div>
                <div className="space-y-4 my-4">
                  <div>
                    <label className="text-xs font-semibold text-slate-700 block mb-1">
                      Supabase Project URL:
                    </label>
                    <input
                      type="text"
                      value={supabaseUrl}
                      onChange={(e) => setSupabaseUrl(e.target.value)}
                      className="w-full px-3 py-2 border border-slate-200 rounded-lg text-xs font-mono focus:ring-2 focus:ring-emerald-500 focus:outline-none"
                    />
                  </div>
                  <div>
                    <label className="text-xs font-semibold text-slate-700 block mb-1">
                      Supabase Anon Public Key:
                    </label>
                    <input
                      type="password"
                      value={supabaseAnonKey}
                      onChange={(e) => setSupabaseAnonKey(e.target.value)}
                      className="w-full px-3 py-2 border border-slate-200 rounded-lg text-xs font-mono focus:ring-2 focus:ring-emerald-500 focus:outline-none"
                    />
                  </div>
                  <div>
                    <label className="text-xs font-semibold text-slate-700 block mb-1">
                      Send-Message API Endpoint:
                    </label>
                    <input
                      type="text"
                      value={apiUrl}
                      onChange={(e) => setApiUrl(e.target.value)}
                      className="w-full px-3 py-2 border border-slate-200 rounded-lg text-xs font-mono focus:ring-2 focus:ring-emerald-500 focus:outline-none"
                    />
                  </div>
                </div>
                <button
                  onClick={() => {
                    setShowSettingsModal(false);
                    fetchContacts();
                    showNotice('Pengaturan integrasi disimpan.', 'success');
                  }}
                  className="w-full py-2.5 bg-slate-900 hover:bg-slate-800 text-white font-semibold text-xs rounded-xl transition"
                >
                  Simpan & Hubungkan
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
